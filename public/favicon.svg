<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E3F2FD" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Radio Frequency Waves -->
  <path d="M 370 180 A 130 130 0 0 1 370 332" fill="none" stroke="#64B5F6" stroke-width="28" stroke-linecap="round" opacity="0.6"/>
  <path d="M 410 140 A 180 180 0 0 1 410 372" fill="none" stroke="#90CAF9" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Letter K Stylized -->
  <g fill="url(#kGrad)">
    <!-- Vertical stem -->
    <rect x="130" y="128" width="54" height="256" rx="16" />
    <!-- Top diagonal arm -->
    <path d="M 180 260 L 295 138 C 304 128 320 128 329 138 L 340 150 C 348 160 346 174 336 184 L 242 276 L 180 260 Z" />
    <!-- Bottom diagonal arm -->
    <path d="M 220 250 L 328 360 C 338 370 338 386 328 396 L 314 408 C 304 416 288 414 280 404 L 180 295 L 220 250 Z" />
  </g>
  
  <!-- Center RF Pulse Dot -->
  <circle cx="236" cy="264" r="16" fill="#BBDEFB" />
</svg>
